<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="modern_animated_login_form.css">
    <script src="modern_animated_login_form.js"></script>
    <title>Modern Animated Login Form</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        * {
            font-family: 'Poppins', sans-serif;
        }
        @property --a {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }
        .box {
            position: relative;
            width: 400px;
            height: 200px;
            background: repeating-conic-gradient(from var(--a), #ff2770 0%, #ff2770 5%, transparent 5%, transparent 40%, #ff2770 50%);
            filter: drop-shadow(0 15px 50px #000);
            border-radius: 20px;
            animation: rotating 4s linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
        }
        @keyframes rotating {
            0% {
                --a: 0deg;
            }
            100% {
                --a: 360deg;
            }
        }
        .box:hover {
            width: 450px;
            height: 250px;
        }
        .login {
            position: absolute;
            inset: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: #00000033;
            color: #fff;
            border-radius: 10px;
            transition: 0.5s;
        }
        .loginBx {
            display: flex;
            flex-direction: column;
            gap: 20px;
            transform: translateY(126px);
            transition: 0.5s;
        }
        .loginBx input[type="text"], 
        .loginBx input[type="password"], 
        .loginBx input[type="submit"] {
            width: 100%;
            padding: 10px 20px;
            outline: none;
            border: none;
            border-radius: 30px;
        }
        input[type="text"], input[type="password"] {
            background: #0000001a;
            color: #fff;
            border: 2px solid #fff;
        }
        input::placeholder {
            color: #999;
        }
        input[type="submit"] {
            background: #45f3ff;
            color: #111;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            box-shadow: 0 0 10px #45f3ff, 0 0 60px #45f3ff;
        }
        .group {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .group a {
            color: #fff;
            text-decoration: none;
        }
        .group a:nth-child(2) {
            color: #ff2770;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="login">
            <div class="loginBx">
                <h2>
                    <i class="fa-solid fa-right-to-bracket"></i> Login <i class="fa-solid fa-heart"></i>
                </h2>
                <input type="text" placeholder="Enter username">
                <input type="password" placeholder="Enter password">
                <input type="submit" value="Sign in">
                <div class="group">
                    <a href="#">Forgot Password</a>
                    <a href="#">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
