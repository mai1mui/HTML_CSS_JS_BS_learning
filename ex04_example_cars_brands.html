<html>
    <head>
        <title>Ex02 : Read File</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
        <script>
//            fetch("*.json").then(function (response) {}).then(function (recordset) {})
            fetch("ex04_example_cars_brands.json")
                    .then(function (response) {
                        return response.json();
                    }).then(function (recordset) {
                var display_table1 = document.querySelector(".data-display-tb1");
                var display_table2 = document.querySelector(".data-display-tb2");
                var data_tb1 = "";
                var data_tb2 = "";
                // Hiển thị brands
                var brands = recordset.brands;
                for (var i = 0; i < brands.length; i++) {
                    var brand = brands[i];
                    data_tb1 += `<tr><td>${brand.code}</td><td>${brand.bname}</td></tr>`;
                }

                // Hiển thị cars
                var cars = recordset.cars;
                for (var i = 0; i < cars.length; i++) {
                    var car = cars[i];
                    data_tb2 += `<tr><td>${i + 1}</td><td>${car.brand}</td><td>${car.model}</td><td>${car.price}</td></tr>`;
                }
                display_table1.innerHTML = data_tb1;
                display_table2.innerHTML = data_tb2;
            });

        </script>

    </head>
    <body>
        <!--View-->
        <section class="container mt-4 d-flex gap-4 justify-content-between">
            <div class="border rounded-3 p-3 bg-light shadow-sm w-100">
                <h3 class="text-center mb-3 text-dark fw-bold">Danh sách Brands</h3>
                <table class="table table-striped table-hover table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Brand Code</th>
                            <th scope="col">Brand Name</th>
                        </tr>

                    </thead>
                    <tbody class="data-display-tb1">
                        <!--script data display here-->
                    </tbody>


                </table>
            </div>
            <div class="border rounded-3 p-3 bg-light shadow-sm w-100">
                <h3 class="text-center mb-3 text-dark fw-bold">Chi tiết Brands</h3>
                <table class="table table-striped table-hover table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Brand</th>
                            <th scope="col">Model</th>
                            <th scope="col">Price</th>
                        </tr>

                    </thead>
                    <tbody class="data-display-tb2">
                        <!--script data display here-->
                    </tbody>


                </table>
            </div>


        </section>

    </body>
</html>
